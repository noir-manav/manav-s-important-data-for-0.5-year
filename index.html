<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My ZIP Downloader</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 35px 25px;
            text-align: center;
            background: #ffffff12;
            border: 1px solid #ffffff30;
            border-radius: 20px;
            box-shadow: 0 10px 35px #00000040;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        p {
            color: #dddddd;
            line-height: 1.6;
        }

        .download-btn {
            display: block;
            width: 100%;
            margin-top: 25px;
            padding: 16px;
            background: #00c896;
            color: #071b16;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            border-radius: 10px;
            transition: 0.2s;
        }

        .download-btn:hover {
            background: #00e6ac;
            transform: translateY(-2px);
        }

        .filename {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            background: #00000030;
            overflow-wrap: anywhere;
        }

        .footer {
            margin-top: 22px;
            font-size: 12px;
            color: #bbbbbb;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📦 My ZIP Downloader</h1>

        <p>Click the button below to download your ZIP file.</p>

        <div class="filename">
            📁 File: data.zip
        </div>

        <a
            class="download-btn"
            href="data.zip"
            download="data.zip"
        >
            ⬇️ Download ZIP
        </a>

        <div class="footer">
            My Personal File Archive
        </div>

    </div>

</body>
</html>
